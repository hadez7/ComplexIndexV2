{% load static i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'es' }}" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Enterprise Lex Index{% endblock %}</title>

    <!-- Pre-render síncrono del tema para eliminar parpadeo (FOUC) -->
    <script>
        (function () {
            document.documentElement.classList.add('preload-transitions');
            const savedTheme = localStorage.getItem('eli_theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{% static 'images/favicon.svg' %}">
    <link rel="alternate icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
    <link rel="apple-touch-icon" href="{% static 'images/favicon-apple.png' %}">

    <!-- Google Fonts: Manrope & IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS 3 precompilado -->
    <link rel="stylesheet" href="{% static 'css/tailwind.min.css' %}?v=eli-15">

    <style>
        html.preload-transitions,
        html.preload-transitions *,
        html.preload-transitions *:before,
        html.preload-transitions *:after {
            transition: none !important;
        }

        html {
            background-color: var(--surface);
            color: var(--ink);
        }

        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            font-feature-settings: 'cv02' 1, 'cv03' 1, 'cv04' 1, 'cv11' 1;
            letter-spacing: -0.011em;
            background-color: var(--surface);
            color: var(--ink);
        }

        .font-mono {
            font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-feature-settings: 'zero' 1;
        }
    </style>
</head>

<body class="h-full">
    {% block content %}{% endblock %}
</body>

</html>
