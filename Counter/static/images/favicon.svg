<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="eliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#eliGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />
  
  <!-- Stylized ELI Lettering -->
  <text x="32" y="38" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
        font-size="24" 
        font-weight="900" 
        letter-spacing="-0.5px" 
        fill="#ffffff" 
        text-anchor="middle"
        filter="url(#subtleGlow)">ELI</text>
        
  <!-- Accent pill below lettering -->
  <rect x="22" y="45" width="20" height="3" rx="1.5" fill="#93c5fd" />
</svg>
